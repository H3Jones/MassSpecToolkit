name: Deploy website to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out default-branch HEAD
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Record source commit
        run: echo "Source commit $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          working-directory: apps/web
          node-version: "22"
          cache: true
          run-install: false

      - name: Install dependencies from lockfiles
        run: |
          npm ci --prefix packages/ms-toolkit
          npm ci --prefix apps/web

      - name: Install Rust WebAssembly target and wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build website and WebAssembly
        working-directory: apps/web
        run: npm run build

      - name: Test website
        working-directory: apps/web
        run: npm test

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
