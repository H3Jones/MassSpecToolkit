[package]
name = "ms-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
ms-core = { path = "../ms-core" }
rmcp = { version = "3.11.0", default-features = false, features = ["macros", "server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
