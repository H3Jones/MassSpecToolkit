[package]
name = "ms-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ms-core = { path = "../ms-core" }
ms-readers = { path = "../ms-readers", features = ["asc"] }
serde = { version = "1", features = ["derive"] }
tsify = { version = "0.5.8", features = ["js"] }
wasm-bindgen = "0.2"
