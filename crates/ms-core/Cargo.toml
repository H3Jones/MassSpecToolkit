[package]
name = "ms-core"
version = "0.1.0"
edition = "2024"

[dependencies]
pest = "2.8.1"
pest_derive = "2.8.1"
serde = { version = "1.0.229", features = ["derive"] }

[build-dependencies]
toml = "0.8"

[dev-dependencies]
insta = { version = "1.49.0", features = ["yaml"] }

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
